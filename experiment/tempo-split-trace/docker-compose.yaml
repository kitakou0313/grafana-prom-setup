services:
  tempo1:
    image: grafana/tempo:latest
    container_name: tempo-split-trace-tempo1
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"   # Tempo query API
    volumes:
      - ./tempo1.yml:/etc/tempo.yml
      - tempo1-data:/var/tempo
    networks:
      - tempo-split-trace
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  tempo2:
    image: grafana/tempo:latest
    container_name: tempo-split-trace-tempo2
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "4327:4317"   # OTLP gRPC
      - "4328:4318"   # OTLP HTTP
      - "3201:3200"   # Tempo query API
    volumes:
      - ./tempo2.yml:/etc/tempo.yml
      - tempo2-data:/var/tempo
    networks:
      - tempo-split-trace
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    container_name: tempo-split-trace-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - tempo-split-trace
    depends_on:
      tempo1:
        condition: service_healthy
      tempo2:
        condition: service_healthy

  service-b:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    container_name: tempo-split-trace-service-b
    environment:
      - TEMPO2_ENDPOINT=tempo2:4317
    networks:
      - tempo-split-trace
    depends_on:
      tempo2:
        condition: service_healthy

  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    container_name: tempo-split-trace-service-a
    environment:
      - TEMPO1_ENDPOINT=tempo1:4317
      - SERVICE_B_BASE_URL=http://service-b:8081
    networks:
      - tempo-split-trace
    depends_on:
      tempo1:
        condition: service_healthy
      service-b:
        condition: service_started

  # Uninstrumented request trigger. Not part of `up -d` (see profiles); run
  # `docker compose run --rm client` whenever a new trace should be sent.
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: tempo-split-trace-client
    environment:
      - SERVICE_A_URL=http://service-a:8080/handle
    networks:
      - tempo-split-trace
    depends_on:
      service-a:
        condition: service_started
    restart: "no"
    profiles:
      - trigger

networks:
  tempo-split-trace:
    driver: bridge

volumes:
  tempo1-data:
  tempo2-data:
